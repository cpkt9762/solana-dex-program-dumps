name: Collect DEX program dumps

on:
  schedule:
    - cron: "0 2 * * *" # every day at 02:00 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated registry names to process (empty = all)"
        required: false
        default: ""
      verify_hash:
        description: "Dump every program and compare sha256 even if last_deployed_slot is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

# Never run two collections at once: they would race on the same branch.
concurrency:
  group: collect-dumps
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Shallow checkout (the default): git only holds metadata, binaries are release assets.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Solana CLI (Anza)
        env:
          # Repository variable SOLANA_VERSION can pin a release, e.g. v3.1.14.
          SOLANA_VERSION: ${{ vars.SOLANA_VERSION || 'stable' }}
        run: |
          sh -c "$(curl -sSfL "https://release.anza.xyz/${SOLANA_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          solana --version
          python --version

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Collect program dumps
        id: collect
        # Keep going on failure so that programs which did update are still committed;
        # the job is failed explicitly in the last step.
        continue-on-error: true
        env:
          # An unset secret becomes an empty string; collect.py then uses the public RPC.
          RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          # Used by the gh CLI to create releases (needs contents: write).
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          VERIFY_HASH: ${{ inputs.verify_hash }}
        run: |
          args=(--release-repo "$GITHUB_REPOSITORY" --commit-message-file "$RUNNER_TEMP/commit-message.txt")
          if [ "$VERIFY_HASH" = "true" ]; then
            args+=(--verify-hash)
          fi
          if [ -n "$ONLY" ]; then
            read -ra names <<< "$ONLY"
            args+=(--only "${names[@]}")
          fi
          python scripts/collect.py "${args[@]}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Releases for these versions already exist at this point; if this commit or the
          # push fails, the next run finds the releases and reuses them.
          for path in dumps archives index.json; do
            if [ -e "$path" ]; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No program changes to commit."
            exit 0
          fi

          if [ -f "$RUNNER_TEMP/commit-message.txt" ]; then
            git commit -F "$RUNNER_TEMP/commit-message.txt"
            { echo '### Program changes'; echo; tail -n +3 "$RUNNER_TEMP/commit-message.txt"; } >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore(dumps): update program dumps"
          fi

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repository activity.
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git commit --allow-empty -m "chore: keepalive commit (scheduled workflows are disabled after 60 days of inactivity)"
          fi

      - name: Push
        run: |
          branch="${GITHUB_REF_NAME}"
          if [ "$(git rev-list --count "origin/${branch}..HEAD")" -eq 0 ]; then
            echo "Nothing to push."
            exit 0
          fi
          git pull --rebase origin "${branch}"
          git push origin "HEAD:${branch}"

      - name: Fail if any program could not be collected
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::collect.py reported failures, see the 'Collect program dumps' step"
          exit 1
